<!DOCTYPE html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elif Işıl Beşgür</title>
    <meta name="description" content="Bilgisayar mühendisliği öğrencisi Elif Işıl Beşgür'ün projeleri: LumaNote, LumaRaf, Kapibara Uçuşu ve Bursa Hazırlık Atlası." />
    <meta name="theme-color" content="#161b36" />
    <meta property="og:title" content="Elif Işıl Beşgür" />
    <meta property="og:description" content="Piksel dünyalı telefon uygulamaları, masaüstü projeleri ve Bursa için bir deprem hazırlık haritası." />
    <meta property="og:image" content="%PUBLIC_URL%/projects/lumanote.webp" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet" />
    <script>
      // Tema, sayfa çizilmeden önce uygulanır (yanıp sönmeyi önler)
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Bu sayfayı görüntülemek için JavaScript'i etkinleştirmen gerekiyor.</noscript>
    <div id="root"></div>
  </body>
</html>
